  <rect x="116" y="54" width="280" height="68" rx="34" fill="url(#accent)"/>
  <text x="256" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#0f172a" text-anchor="middle">OK SUR</text>
  <!-- Bus Body -->
  <rect x="112" y="148" width="288" height="236" rx="40" fill="#f8fafc"/>
  <rect x="132" y="168" width="248" height="34" rx="10" fill="#0f172a"/>
  <text x="256" y="191" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#38bdf8" text-anchor="middle">500 SUR ? CENTRO</text>
  <!-- Windshield -->
  <rect x="132" y="214" width="248" height="90" rx="16" fill="#0284c7"/>
  <path d="M148 214 L220 214 L180 304 L132 304 Z" fill="#38bdf8" opacity="0.35"/>
  <!-- Headlights -->
  <circle cx="156" cy="344" r="18" fill="#f59e0b"/>
  <circle cx="356" cy="344" r="18" fill="#f59e0b"/>
  <rect x="206" y="336" width="100" height="16" rx="8" fill="#334155"/>
  <!-- Wheels -->
  <rect x="136" y="380" width="52" height="44" rx="14" fill="#06b6d4"/>
  <rect x="324" y="380" width="52" height="44" rx="14" fill="#06b6d4"/>
</svg>